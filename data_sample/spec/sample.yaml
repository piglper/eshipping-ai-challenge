# Datos sintéticos de la demo y de los tests (F3.10, docs/10_diseno_poc.md §7).
#
# TODO ES INVENTADO: empresas, personas, dominios (.example, reservado por la RFC 2606),
# buques, bookings, expedientes y contenedores (dígito de control ISO 6346 válido, prefijo
# SYN). Solo los UN/LOCODE son reales, porque son públicos.
#
# Cada expediente se entrega como un correo contenedor con los mensajes incrustados, igual
# que la muestra real. `make sample` genera los .eml, el CSV del ERP y el gold sintético en
# data_sample/build/ (ignorado por git: el hook bloquea .eml y .csv en cualquier carpeta).
#
# Escenarios (el veredicto esperado de cada campo está en `gold`):
#   ES26900001  camino feliz; levante en los correos y vacío en el ERP -> ERP_MISSING
#   ES26900002  roleo con cambio de buque y booking nuevo (alias); reenvío que cita el aviso
#               de la naviera -> DISCREPANCY en buque, salida y llegada
#   ES26900003  salida real con errata día-mes en el ERP -> ERP_ERROR; carga en un rango;
#               el cliente (rango C) da otra ETA con fecha ambigua -> pendiente de confirmar
#   ES26900004  el ERP marca la salida como real después del último correo -> ERP_NEWER;
#               llegada vacía en el ERP -> ERP_MISSING; correo con instrucciones maliciosas
#   ruido       boletín sin relación con ningún expediente -> OTR

