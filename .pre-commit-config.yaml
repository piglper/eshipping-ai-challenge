# Se ejecuta desde .githooks/pre-commit (core.hooksPath) y en el CI con --all-files.
repos:
  - repo: local
    hooks:
      - id: block-confidential
        name: bloquear datos confidenciales
        language: fail
        entry: "Fichero potencialmente confidencial (data/, csv, eml, msg, pst, mbox). Quítalo del stage."
        files: '(^|/)data/|\.(csv|eml|msg|pst|mbox)$'
      - id: mypy
        name: mypy
        language: system
        entry: .venv/bin/mypy
        pass_filenames: false
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
