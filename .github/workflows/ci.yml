name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  confidencialidad:
    name: Confidencialidad y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Ningún fichero confidencial versionado
        run: |
          if git ls-files | grep -E '(^|/)data/|\.(csv|eml|msg|pst|mbox)$'; then
            echo "::error::Hay ficheros potencialmente confidenciales en el repositorio"
            exit 1
          fi
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: Hooks genéricos (secretos, ficheros grandes, formato de texto)
        env:
          # ruff y mypy se comprueban en el job de calidad
          SKIP: mypy,ruff-check,ruff-format
        run: |
          pip install pre-commit==4.7.0
          pre-commit run --all-files --show-diff-on-failure

  calidad:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Instalar
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e . --group dev
      - name: Lint
        run: make lint
      - name: Tipos
        run: make typecheck
      - name: Tests
        run: make test
