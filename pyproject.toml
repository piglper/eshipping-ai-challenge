[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "eshipping-ai"
description = "Extracción de eventos operativos de correos de transporte marítimo y reconciliación con el ERP"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Pablo Iglesias Peral" }]
license = "LicenseRef-Proprietary"
dynamic = ["version"]
# Las dependencias de ejecución se añaden en F3, solo cuando se necesitan y con versión fijada.
dependencies = [
    "extract-msg==0.58.3",
    "alembic==1.20.1",
    "pydantic==2.14.4",
    "sqlalchemy==2.1.9",
    "pypdf==7.1.1",
    "pyyaml==6.0.4",
]

[project.optional-dependencies]
# Vista para operativos (make ui); la CLI no la necesita.
ui = ["streamlit==1.66.1"]

[project.scripts]
eshipping = "eshipping_ai.entrypoints.cli:main"

[dependency-groups]
dev = [
    "import-linter==2.17",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "streamlit==1.66.1",
    "types-pyyaml==6.0.12.20261103",
]

[tool.hatch.version]
path = "src/eshipping_ai/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eshipping_ai"]

# --- ruff -------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return
    "PTH",      # pathlib
    "DTZ",      # fechas sin zona horaria
    "BLE",      # except genéricos
    "S",        # seguridad (bandit)
    "D",        # docstrings
    "ANN",      # anotaciones de tipo
    "PL",       # pylint
    "RUF",
]
ignore = [
    "D105", "D107",   # docstrings en métodos mágicos y __init__
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ANN", "PLR2004"]
"migrations/**" = ["D", "ANN", "E501", "ERA", "N999", "INP001", "RUF012", "I001", "UP", "PLR"]

# --- import-linter ----------------------------------------------------------
# Regla de dependencias de la arquitectura hexagonal (RNF-40, arquitectura §6.3):
# cada capa solo puede importar las que tiene debajo.

[tool.importlinter]
root_package = "eshipping_ai"

[[tool.importlinter.contracts]]
name = "Capas de la arquitectura hexagonal"
type = "layers"
layers = [
    "eshipping_ai.entrypoints",
    "eshipping_ai.adapters",
    "eshipping_ai.application",
    "eshipping_ai.extraction",
    "eshipping_ai.domain",
]

# --- mypy -------------------------------------------------------------------

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["eshipping_ai"]
warn_unreachable = true

# --- pytest -----------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[tool.coverage.run]
source = ["eshipping_ai"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
